<!doctype html> 
<html lang="ja"> 
  <head> 
    <meta charset="utf-8" /> 
    <meta name="viewport" content="width=device-width, initial-scale=1 " /> 
 
    <title>AR.js Marker Example</title> 
    <!-- A-Frame 本体 --> 
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- AR.js for A-Frame (CDN) --> 
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script> 
    <style> 
      body, html { margin:0; padding:0; overflow:hidden; } 
      .hint { position: fixed; left: 50%; transform: translateX(-50%);
       bottom: 12px; background: rgba(0,0,0,.6); color: #fff; padding: 6px 1
       0px; border-radius: 8px; font-size: 14px; } 
    </style> 
  </head> 
  <body> 
    <!-- arjs="sourceType: webcam;" で端末カメラを使用 --> 
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;"> 

      
      <a-marker preset="hiro"> 

      <a-box position="0 0 -10" rotation="0 45 0" color="#4CC3D9" shadow="" material="color: #feeba4"
        geometry="depth: 10; width: 10"></a-box><a-box position="0 1.5 -10" rotation="0 45 0" color="#4CC3D9" shadow=""
        material="color: #feeba4" geometry="depth: 7; width: 7"></a-box><a-box position="0 2 -10" rotation="0 45 0"
        color="#4CC3D9" shadow="" material="color: #feeba4" geometry="depth: 6; width: 6"></a-box><a-box
        position="0 2.5 -10" rotation="0 45 0" color="#4CC3D9" shadow="" material="color: #feeba4"
        geometry="depth: 5; width: 5"></a-box><a-box position="0 3 -10" rotation="0 45 0" color="#4CC3D9" shadow=""
        material="color: #feeba4" geometry="depth: 4; width: 4"></a-box><a-box position="0 3.5 -10" rotation="0 45 0"
        color="#4CC3D9" shadow="" material="color: #feeba4" geometry="depth: 3; width: 3"></a-box><a-box
        position="0 4 -10" rotation="0 45 0" color="#4CC3D9" shadow="" material="color: #feeba4"
        geometry="depth: 2; width: 2"></a-box><a-box position="0 4.5 -10" rotation="0 45 0" color="#4CC3D9" shadow=""
        material="color: #feeba4" geometry=""></a-box><a-box position="0 4 -10" rotation="0 45 0" color="#4CC3D9"
        shadow="" material="color: #feeba4" geometry="depth: 2; width: 2"></a-box><a-box position="0 3.5 -10"
        rotation="0 45 0" color="#4CC3D9" shadow="" material="color: #feeba4"
        geometry="depth: 3; width: 3"></a-box><a-box position="0 3 -10" rotation="0 45 0" color="#4CC3D9" shadow=""
        material="color: #feeba4" geometry="depth: 4; width: 4"></a-box><a-box position="0 2.5 -10" rotation="0 45 0"
        color="#4CC3D9" shadow="" material="color: #feeba4" geometry="depth: 5; width: 5"></a-box><a-box
        position="0 2 -10" rotation="0 45 0" color="#4CC3D9" shadow="" material="color: #feeba4"
        geometry="depth: 6; width: 6"></a-box><a-box position="0 1.5 -10" rotation="0 45 0" color="#4CC3D9" shadow=""
        material="color: #feeba4" geometry="depth: 7; width: 7"></a-box><a-box position="0 1 -10" rotation="0 45 0"
        color="#4CC3D9" shadow="" material="color: #feeba4" geometry="depth: 8; width: 8"></a-box><a-box
        position="0 0.5 -10" rotation="0 45 0" color="#4CC3D9" shadow="" material="color: #feeba4"
        geometry="depth: 9; width: 9"></a-box>
      <a-sphere position="-8.27148 10.878 -5" radius="1.25" color="#EF2D5E" shadow="" material="color: #ff8838"
        geometry=""></a-sphere>
        
      </a-marker> 
      
        <!-- 原点に簡単な立方体を表示 --> 
        <!-- <a-box position="0 0.5 0" depth="1" height="1" width="1" color="#4CC3D9"></a-box>  -->
        <!-- <a-sphere position="1 1 0" radius="0.5" color="#EF2D5E"></a-sphere>  -->
        <!-- <a-text value="Hello AR.js" position="-0.8 1.8 0" color="#fff"></a-text>  -->
      <!-- </a-marker>  -->
      <!-- カメラ --> 
      <a-entity camera></a-entity> 
    </a-scene> 
    <div class="hint">マーカー（HIRO）をかざしてみてください</div> 
  </body> 
</html>
